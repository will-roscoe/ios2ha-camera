[project]
name = "ios2ha-camera"
# The single source of truth. Read at runtime from installed package metadata,
# so there is no second copy in the source to drift. Semantics are in
# CHANGELOG.md: the Home Assistant entity and topic surface is the public
# interface, because that is what breaks other people's automations.
version = "2.4.0"
description = "Turns an old iPhone running a camera app into a Home Assistant camera"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Will Roscoe" }]
keywords = ["home-assistant", "mqtt", "camera", "iphone", "onvif", "frame-stacking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Video :: Capture",
]

dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "opencv-python-headless>=4.9",
    "paho-mqtt>=2.0",
    "aiohttp>=3.9",
    # Floor raised to the 11.x line the code is written against and verified on
    # arcturus (11.12.4); the 4.x API differs enough to break phone.py.
    "pymobiledevice3>=11.0,<12",
    # Pure-python asyncio D-Bus. The slim image has no GLib bindings, and the
    # keyboard only ever talks to org.bluez, through the filtered proxy socket.
    "dbus-fast>=2.21",
]

[project.urls]
Homepage = "https://github.com/will-roscoe/ios2ha-camera"
Changelog = "https://github.com/will-roscoe/ios2ha-camera/blob/main/CHANGELOG.md"
Issues = "https://github.com/will-roscoe/ios2ha-camera/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
docs = [
    "sphinx>=8.0",
    "furo>=2024.8",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-copybutton>=0.5",
    "myst-parser>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "." so tests can import the shared fixtures as tests.fakes.*
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
# E/F are pyflakes + pycodestyle, I sorts imports, UP modernises syntax to the
# 3.12 floor, B catches likely bugs. Deliberately not the full rule set: this is a
# small service, and a lint that fires on style opinions rather than defects gets
# ignored.
select = ["E", "F", "I", "UP", "B"]
# onvif.py builds SOAP envelopes from %s templates. f-strings would not read more
# clearly there, and rewriting working device-facing request bodies for a style
# rule is risk without benefit.
ignore = ["UP031"]

[tool.ruff.lint.per-file-ignores]
# The tests use semicolons to keep fixture setup on one line ("buf = RingBuffer(N);
# states = []") and run long on assertion messages. That is a deliberate density
# choice in test code and says nothing about the shipped service, so only the
# formatting rules are relaxed here -- F, I, UP and B still apply.
"tests/**" = ["E501", "E702", "E731"]
# WS-Security and ONVIF namespace URLs are 85-120 characters and cannot be split.
# Ruff already tolerates the worst lines here because an unsplittable token is
# exempt from E501, so enforcing the limit on their neighbours only rewards
# hiding a URL behind a variable. The whole file is exempt instead.
"src/ios2ha_camera/onvif.py" = ["E501"]

[tool.coverage.run]
source = ["ios2ha_camera"]
branch = true
