name: CI

# Lint, tests and an image build. Deliberately narrower than a library's CI: this
# ships as one Linux container on one Python, so a cross-platform matrix would be
# testing configurations that never run. 3.13 is here because pyproject claims
# ">=3.12" -- if that claim stops being true we should find out, not the user.

#
# Each commit is tested once:
# - develop: on push. It is the integration branch that work merges into, and
#   pull_request checks the merge preview, not the branch after the merge.
# - main: NOT on push. Every push to main runs auto-release.yml, which calls this
#   workflow as its release gate, so listing main here would test the same commit
#   twice.
# - Pull requests: yes, except develop -> main (see SKIP_DEVELOP_TO_MAIN below).

on:
  push:
    branches: [develop]
  pull_request:
  workflow_call:

# A second push to the same branch makes the first run's answer irrelevant. The
# workflow name is in the group because, when auto-release calls this workflow,
# github.workflow is the caller's name. That keeps the release gate from cancelling,
# or being cancelled by, an ordinary run on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# SKIP_DEVELOP_TO_MAIN: a develop -> main pull request has the same head commit
# that the develop push run already tested, and GitHub shows that run's checks on
# the pull request. If main has commits develop lacks, the merged result differs,
# but the release gate tests it after the merge and before anything is tagged.
# Skipped jobs count as passing.

jobs:
  lint:
    if: ${{ !(github.event_name == 'pull_request' && github.head_ref == 'develop' && github.base_ref == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.6"

      # Config lives in pyproject under [tool.ruff]; no flags here, so what CI
      # enforces is exactly what `ruff check` does locally.
      - name: Lint
        run: ruff check --output-format github .

  test:
    if: ${{ !(github.event_name == 'pull_request' && github.head_ref == 'develop' && github.base_ref == 'main') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # No network and no phone in CI: the suite fakes both (tests/fakes/), so a
      # failure here is a real defect rather than a missing device.
      - name: Test
        run: pytest -q --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docker:
    if: ${{ !(github.event_name == 'pull_request' && github.head_ref == 'develop' && github.base_ref == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # deploy.sh builds the image on the target host, so a broken Dockerfile is
      # only discovered mid-deploy against the running camera. Building it here
      # moves that discovery to the pull request. Not pushed anywhere: the build
      # succeeding is the whole assertion.
      - name: Build image
        run: docker build -t ios2ha-camera:ci .
