name: Auto Release

# Reads the Conventional Commit messages since the last version tag, decides the
# next SemVer, tags it, and publishes the Release.
#
# Runs on every push to main, which in practice means every develop -> main merge.
# A merge that carries no feat/fix/perf/breaking commit releases nothing. A merge
# that does is only tagged if pyproject.toml already declares the version the
# commits imply, so a forgotten bump fails loudly instead of publishing a tag that
# disagrees with what the running container reports.
#
# This is also main's only CI run: the `ci` job below is the release gate, and
# ci.yml deliberately does not run on pushes to main as well.
#
# A tag pushed by this workflow does not trigger release.yml's own tag trigger
# (GitHub does not start workflows from GITHUB_TOKEN pushes), so the release job
# below calls it directly. A tag pushed by hand goes through that trigger instead.
#
# From the Actions tab, the `dry-run` input (on by default) computes and prints the
# next version without tagging anything, which shows what a merge would do.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Compute the next version and stop, without tagging
        type: boolean
        default: true

# Never run two auto-releases at once: they would race on tag creation.
concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Release gate: no tag is created unless lint, both Python versions and the image
  # build all pass on the exact commit being tagged.
  ci:
    uses: ./.github/workflows/ci.yml

  compute:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.decide.outputs.released }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide the next version
        id: decide
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet

          # versionsort.suffix=- makes pre-release tags (v1.2.0-rc.1) sort BEFORE
          # their final release, matching SemVer precedence. Without it git puts
          # suffixed tags after the release and we would pick a stale latest.
          LATEST=$(git -c versionsort.suffix=- tag --list 'v[0-9]*' --sort=-version:refname | head -n1)
          echo "latest tag: ${LATEST:-<none>}"

          RANGE="HEAD"
          [ -n "$LATEST" ] && RANGE="${LATEST}..HEAD"

          NEXT=$(git log -z --format=%B "$RANGE" \
            | CURRENT_VERSION="$LATEST" python .github/scripts/compute_next_version.py)

          if [ -z "$NEXT" ]; then
            echo "No feat/fix/perf/breaking commits since ${LATEST:-the start} — no release."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="v${NEXT}"
          echo "next version: $TAG"
          echo "### Next version: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run — not tagging."
            echo "_Dry run: nothing was tagged._" >> "$GITHUB_STEP_SUMMARY"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists — skipping to avoid a duplicate release."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # pyproject carries the version too, and the tag must not disagree with
          # what the running container reports.
          DECLARED=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$DECLARED" != "$NEXT" ]; then
            echo "::error::pyproject.toml says $DECLARED but the commits imply $NEXT."
            echo "::error::Bump pyproject.toml (and add a CHANGELOG entry) before releasing."
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  release:
    needs: compute
    if: needs.compute.outputs.released == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.compute.outputs.tag }}
