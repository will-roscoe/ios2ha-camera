name: Docs

# Builds the Sphinx documentation on every push and pull request, and publishes it
# to GitHub Pages from main.
#
# THE PUBLISHED SITE IS PUBLIC even though this repository is private -- verified by
# fetching https://will-roscoe.github.io/ios2ha-camera/ unauthenticated. Restricting
# who can read a Pages site is an Enterprise feature; enabling Pages here does not
# do it. Everything Sphinx renders is therefore world-readable, including the full
# module source that sphinx.ext.viewcode publishes under _modules/. That is
# intended, on the condition that no credential ever reaches it, which the
# credential scan below enforces rather than leaves to memory.

on:
  push:
    # The deploy job below is still restricted to main, so develop builds the docs
    # and checks them for credentials without publishing anything.
    branches: [main, develop]
  pull_request:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Installed, not just the docs extra: conf.py reads the version from the
      # installed package metadata, and autodoc imports the modules.
      - name: Install
        run: pip install -e ".[docs]"

      # -W makes warnings fatal so broken references cannot accumulate. The one
      # known-noisy class (relative links between the root Markdown files) is
      # suppressed in conf.py with its reason.
      - name: Build
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      # Runs before either upload, so a leaked credential fails the job rather than
      # being published and then retracted -- a secret that reached a public URL has
      # to be rotated, not deleted.
      - name: Check for credentials in the rendered docs
        run: python .github/scripts/check_docs_secrets.py docs/_build/html

      - name: Upload rendered site
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
