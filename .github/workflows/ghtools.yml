# ghtools-stub: 1 — generated by `ghtools init`; settings live in .github/ghtools.toml
name: ghtools
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Compute the release without writing anything
        type: boolean
        default: true
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ghtools-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pipeline:
    uses: will-roscoe/.ghtools/.github/workflows/pipeline.yml@v1
    with:
      dry-run: ${{ inputs.dry-run || false }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  # Publishes the released version's container image to ghcr.io (release.publish includes "ghcr").
  publish-ghcr:
    needs: pipeline
    if: needs.pipeline.outputs.released == 'true'
    permissions:
      contents: read
      packages: write
    uses: will-roscoe/.ghtools/.github/workflows/ghcr.yml@v1
    with:
      tag: ${{ needs.pipeline.outputs.tag }}
      version: ${{ needs.pipeline.outputs.version }}
      platforms: linux/amd64,linux/arm64
