<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone Camera</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <span id="conn" data-on="false" title="connecting"></span>
  <h1 id="title">iPhone Camera</h1>
  <span id="version"></span>
</header>
<main>
  <section id="viewer">
    <nav id="tabs"></nav>
    <div id="frame">
      <img id="picture" alt="">
      <button id="start-stream" hidden></button>
    </div>
  </section>
  <section id="entities"></section>
  <p id="fatal"></p>
</main>
<script src="app.js"></script>
</body>
</html>
